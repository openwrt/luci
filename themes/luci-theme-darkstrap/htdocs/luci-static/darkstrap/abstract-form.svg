<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Deep Space Multi-Tone Refractive Cyber Gradients -->
    <linearGradient id="cyberRibbonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#1d4ed8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.88"/>
      <stop offset="75%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="cyberRibbonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.90"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="amberSpecularGold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.40"/>
    </linearGradient>

    <radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#2563eb" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for High-Precision Multi-Layer Luminance -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientField" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>

    <filter id="specularGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Atmospheric Radiant Bloom -->
  <circle cx="500" cy="500" r="320" fill="#0284c7" filter="url(#ambientField)" opacity="0.22"/>
  <circle cx="560" cy="450" r="260" fill="#38bdf8" filter="url(#ambientField)" opacity="0.16"/>
  <circle cx="440" cy="550" r="230" fill="#f59e0b" filter="url(#ambientField)" opacity="0.10"/>

  <!-- Geometric 3D Cyber Sculpture -->
  <g filter="url(#coreGlow)">
    <!-- 1. Outer Continuous Möbius Torus Ribbon -->
    <path d="M 460,130 C 740,100 910,310 850,590 C 790,830 530,900 340,790 C 190,700 210,470 380,400 C 560,330 740,470 670,680 C 620,830 450,860 320,780" 
          fill="none" stroke="url(#cyberRibbonGrad1)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. Dual Chiseled Specular Edges (Light Refraction Highlight) -->
    <path d="M 480,136 C 720,112 880,300 830,560 C 770,780 540,860 360,770 C 230,690 240,480 390,420 C 550,360 710,480 650,660" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.75" stroke-linecap="round" filter="url(#specularGlow)"/>

    <path d="M 440,124 C 700,90 890,290 820,540 C 750,760 520,840 340,750 C 210,670 220,460 370,400 C 530,340 690,460 630,640" 
          fill="none" stroke="url(#amberSpecularGold)" stroke-width="2.5" stroke-opacity="0.80" stroke-linecap="round"/>

    <!-- 3. Interlocking Harmonic Gyroscope Orbit (Tilted Torus Ring) -->
    <ellipse cx="500" cy="500" rx="270" ry="175" transform="rotate(-35 500 500)" 
             fill="none" stroke="url(#cyberRibbonGrad2)" stroke-width="22" stroke-opacity="0.85" stroke-linecap="round"/>

    <!-- 4. Subtle Outer Precision Data Orbit Rings -->
    <circle cx="500" cy="500" r="380" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="10 16 36 16"/>
    <circle cx="500" cy="500" r="415" fill="none" stroke="url(#amberSpecularGold)" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6 30 72 30"/>

    <!-- 5. Inner Core Floating Harmonic Ring -->
    <ellipse cx="510" cy="510" rx="140" ry="200" transform="rotate(45 510 510)" 
             fill="none" stroke="url(#cyberRibbonGrad1)" stroke-width="15" stroke-opacity="0.75"/>

    <!-- 6. Harmonic Core Node Constellations -->
    <circle cx="850" cy="590" r="11" fill="url(#plasmaCore)"/>
    <circle cx="850" cy="590" r="3.5" fill="#ffffff"/>

    <circle cx="340" cy="790" r="9" fill="url(#plasmaCore)"/>
    <circle cx="340" cy="790" r="2.8" fill="#ffffff"/>

    <circle cx="380" cy="400" r="10" fill="url(#nodeGlowAmber)"/>
    <circle cx="380" cy="400" r="3.2" fill="#ffffff"/>

    <circle cx="670" cy="680" r="8" fill="url(#nodeGlowAmber)"/>
    <circle cx="670" cy="680" r="2.5" fill="#ffffff"/>
  </g>
</svg>
